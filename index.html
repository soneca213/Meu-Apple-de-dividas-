<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17 Anos - Thaís Vitória</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; background-color: #fdfbff; }

        /* --- TELA 1: ENVELOPE --- */
        #tela-envelope {
            position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; background: #fdfbff;
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s;
        }
        .envelope {
            position: relative; width: 280px; height: 180px; background: #e1bee7;
            border-radius: 0 0 10px 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); cursor: pointer;
        }
        .envelope::before {
            content: ""; position: absolute; top: 0; border-top: 100px solid #b39ddb;
            border-left: 140px solid transparent; border-right: 140px solid transparent; z-index: 2;
        }
        .selo {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            width: 50px; height: 50px; background: linear-gradient(135deg, #d4af37, #f9e29c);
            border-radius: 50%; z-index: 3; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-size: 24px;
        }

        /* --- TELA 2: CONVITE EM TELA CHEIA --- */
        #tela-convite {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 1s ease;
        }

        /* Imagem de Fundo (Sua Imagem 7163.jpg) */
        .fundo-imagem {
            position: absolute; width: 100%; height: 100%;
            background-image: url('https://i.ibb.co/LzdS8mH/7163.jpg'); 
            background-size: cover; background-position: center; z-index: 1;
        }

        /* Card de Informações - Estilo Vidro Luxo */
        .card-luxo {
            position: relative; z-index: 10; width: 90%; max-width: 380px;
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(12px);
            padding: 45px 25px; border-radius: 25px; text-align: center;
            box-shadow: 0 20px 50px rgba(123, 31, 162, 0.15); border: 1px solid rgba(255,255,255,0.5);
        }

        .idade { font-family: 'Playfair Display', serif; color: #7b1fa2; letter-spacing: 6px; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; }
        .nome { font-family: 'Pinyon Script', cursive; color: #4a148c; font-size: 4.2rem; margin: 10px 0; line-height: 1.1; }
        .frase { font-family: 'Playfair Display', serif; font-style: italic; color: #6d4c7d; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }
        
        .infos { margin-bottom: 30px; font-size: 1.1rem; color: #333; line-height: 2; }
        .infos b { color: #7b1fa2; font-weight: 700; }

        .btn-mapa { color: #7b1fa2; text-decoration: underline; font-size: 0.9rem; cursor: pointer; display: block; margin-bottom: 25px; font-weight: 600; }
        
        input {
            width: 100%; padding: 14px; border: none; border-bottom: 2px solid #d1c4e9;
            background: transparent; text-align: center; margin-bottom: 20px; outline: none; font-size: 1.1rem; color: #4a148c;
        }
        .btn-confirmar {
            width: 100%; padding: 16px; background: #7b1fa2; color: white; border: none;
            border-radius: 12px; font-weight: 600; letter-spacing: 1px; cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .btn-confirmar:active { transform: scale(0.98); background: #4a148c; }
        .btn-nao { background: none; border: none; color: #888; margin-top: 15px; font-size: 0.8rem; text-decoration: underline; cursor: pointer; }

        /* BORBOLETAS ANIMADAS (Dando vida ao fundo) */
        .butterfly { position: absolute; width: 35px; height: 35px; z-index: 5; pointer-events: none; }
        .wing { fill: #ba68c8; animation: flap 0.3s infinite alternate; transform-origin: center; opacity: 0.7; }
        @keyframes flap { from { transform: scaleX(0.2); } to { transform: scaleX(1); } }
        @keyframes fly { 
            0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(25deg); opacity: 0; }
        }

        /* Controle de Exibição */
        .aberto { transform: translateY(-100vh); opacity: 0; pointer-events: none; }
        .visivel { visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="tela-envelope" onclick="abrirCarta()">
        <div class="envelope">
            <div class="selo">💌</div>
        </div>
        <p style="margin-top: 30px; color: #7b1fa2; letter-spacing: 3px; font-weight: 600; font-size: 0.9rem;">TOQUE PARA ABRIR</p>
    </div>

    <div id="tela-convite">
        <div class="fundo-imagem"></div>
        
        <div class="card-luxo">
            <p class="idade">17 ANOS</p>
            <h1 class="nome">Thaís Vitória</h1>
            
            <p class="frase">"A vida é um presente e cada momento deve ser celebrado com quem amamos."</p>

            <div class="infos">
                📅 <b>25 DE ABRIL DE 2026</b><br>
                ⏰ <b>ÀS 19:30 HORAS</b><br>
                📍 <b>RUA NOME DA RUA, Nº 00</b>
            </div>

            <span class="btn-mapa" onclick="window.open('https://maps.google.com')">📍 VER LOCALIZAÇÃO NO MAPA</span>

            <input type="text" id="nome_convidado" placeholder="Seu nome completo">
            <button class="btn-confirmar" onclick="confirmar(true)">CONFIRMAR PRESENÇA</button>
            <button class="btn-nao" onclick="confirmar(false)">Não poderei ir</button>
        </div>
    </div>

    <script>
        function abrirCarta() {
            document.getElementById('tela-envelope').classList.add('aberto');
            setTimeout(() => {
                document.getElementById('tela-convite').classList.add('visivel');
            }, 400);
        }

        // Criador de Borboletas Mágicas
        function criarBorboleta() {
            const b = document.createElement('div');
            b.className = 'butterfly';
            b.innerHTML = `<svg viewBox="0 0 100 100"><path class="wing" d="M50 50 Q70 10 90 40 Q90 70 50 60 Q10 70 10 40 Q30 10 50 50" /></svg>`;
            b.style.left = Math.random() * 100 + "vw";
            b.style.top = Math.random() * 100 + "vh";
            const x = (Math.random() - 0.5) * 450;
            const y = (Math.random() - 0.5) * 450;
            b.style.setProperty('--x', x + "px");
            b.style.setProperty('--y', y + "px");
            b.style.animation = `fly ${Math.random() * 7 + 5}s linear forwards`;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 9000);
        }
        setInterval(criarBorboleta, 2000);

        function confirmar(vai) {
            const nome = document.getElementById('nome_convidado').value;
            if(!nome) { alert("Por favor, digite seu nome."); return; }
            const texto = vai ? `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;
            window.open(`https://wa.me/558189659847?text=${encodeURIComponent(texto)}`);
        }
    </script>
</body>
</html>
