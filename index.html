<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>17 Anos - Thaís Vitória</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; width: 100%; overflow: hidden; font-family: 'Montserrat', sans-serif; }

        /* --- TELA 1: ENVELOPE --- */
        #tela-envelope {
            position: fixed; width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; background: #f8f4f9;
            transition: 0.8s ease-in-out;
        }
        .envelope {
            position: relative; width: 280px; height: 180px; background: #e1bee7;
            border-radius: 0 0 10px 10px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); cursor: pointer;
        }
        .envelope::before {
            content: ""; position: absolute; top: 0; border-top: 100px solid #b39ddb;
            border-left: 140px solid transparent; border-right: 140px solid transparent; z-index: 2;
        }
        .selo {
            position: absolute; top: 75px; left: 50%; transform: translateX(-50%);
            width: 45px; height: 45px; background: gold; border-radius: 50%;
            z-index: 3; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); color: white; font-size: 20px;
        }

        /* --- TELA 2: CONVITE --- */
        #tela-convite {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden; transition: opacity 1.2s ease;
        }

        /* IMAGEM DE FUNDO (COLOQUE SEU LINK AQUI) */
        .fundo-imagem {
            position: absolute; width: 100%; height: 100%;
            /* SUBSTITUA O LINK ABAIXO PELO SEU */
            background-image: url('https://https://pin.it/3UbjuxI4c'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        /* Card Centralizado e Maior */
        .card-luxo {
            position: relative; z-index: 10; width: 92%; max-width: 400px;
            background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(8px);
            padding: 50px 25px; border-radius: 25px; text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.4);
        }

        .idade { font-family: 'Playfair Display', serif; color: #7b1fa2; letter-spacing: 6px; font-size: 1.4rem; font-weight: 700; }
        .nome { font-family: 'Pinyon Script', cursive; color: #4a148c; font-size: 4.5rem; margin: 15px 0; line-height: 1; }
        .frase { font-family: 'Playfair Display', serif; font-style: italic; color: #6d4c7d; font-size: 1rem; margin-bottom: 30px; }
        
        .infos { margin-bottom: 35px; font-size: 1.1rem; color: #222; line-height: 2; }
        .infos b { color: #7b1fa2; font-size: 1.3rem; display: inline-block; margin-top: 5px; }

        .btn-mapa { color: #7b1fa2; text-decoration: underline; font-size: 0.9rem; cursor: pointer; display: block; margin-bottom: 30px; font-weight: 600; }
        
        input {
            width: 100%; padding: 15px; border: none; border-bottom: 2px solid #d1c4e9;
            background: transparent; text-align: center; margin-bottom: 25px; outline: none; font-size: 1.1rem;
        }
        .btn-confirmar {
            width: 100%; padding: 18px; background: #7b1fa2; color: white; border: none;
            border-radius: 12px; font-weight: 600; letter-spacing: 2px; cursor: pointer; font-size: 1rem;
        }
        .btn-nao { background: none; border: none; color: #888; margin-top: 20px; font-size: 0.85rem; text-decoration: underline; cursor: pointer; }

        /* BORBOLETAS ANIMADAS */
        .butterfly { position: absolute; width: 40px; height: 40px; z-index: 5; pointer-events: none; }
        .wing { fill: #ba68c8; animation: flap 0.3s infinite alternate; transform-origin: center; opacity: 0.8; }
        @keyframes flap { from { transform: scaleX(0.2); } to { transform: scaleX(1); } }
        @keyframes fly { 
            0% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(30deg); opacity: 0; }
        }

        .aberto { transform: translateY(-100vh); opacity: 0; }
        .visivel { visibility: visible !important; opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="tela-envelope" onclick="abrirCarta()">
        <div class="envelope">
            <div class="selo">❤</div>
        </div>
        <p style="margin-top: 30px; color: #7b1fa2; letter-spacing: 3px; font-weight: 600;">ABRIR CONVITE 💌</p>
    </div>

    <div id="tela-convite">
        <div class="fundo-imagem"></div>
        
        <div class="card-luxo">
            <p class="idade">17 ANOS</p>
            <h1 class="nome">Thaís Vitória</h1>
            
            <p class="frase">"A vida é um presente e cada momento deve ser celebrado com quem amamos."</p>

            <div class="infos">
                📅 <b>25 DE ABRIL DE 2026</b><br>
                ⏰ <b>ÀS 19:30 HORAS</b><br>
                📍 <b>RUA NOME DA RUA, Nº 00</b>
            </div>

            <span class="btn-mapa" onclick="window.open('https://maps.app.goo.gl/exemplo')">📍 VER LOCALIZAÇÃO NO MAPA</span>

            <input type="text" id="nome_convidado" placeholder="Seu nome completo">
            <button class="btn-confirmar" onclick="confirmar(true)">CONFIRMAR PRESENÇA</button>
            <button class="btn-nao" onclick="confirmar(false)">Não poderei ir</button>
        </div>
    </div>

    <script>
        function abrirCarta() {
            document.getElementById('tela-envelope').classList.add('aberto');
            setTimeout(() => {
                document.getElementById('tela-convite').classList.add('visivel');
            }, 300);
        }

        function criarBorboleta() {
            const b = document.createElement('div');
            b.className = 'butterfly';
            b.innerHTML = `<svg viewBox="0 0 100 100"><path class="wing" d="M50 50 Q70 10 90 40 Q90 70 50 60 Q10 70 10 40 Q30 10 50 50" /></svg>`;
            b.style.left = Math.random() * 100 + "vw";
            b.style.top = Math.random() * 100 + "vh";
            const x = (Math.random() - 0.5) * 500;
            const y = (Math.random() - 0.5) * 500;
            b.style.setProperty('--x', x + "px");
            b.style.setProperty('--y', y + "px");
            b.style.animation = `fly ${Math.random() * 6 + 4}s linear forwards`;
            document.body.appendChild(b);
            setTimeout(() => b.remove(), 8000);
        }
        setInterval(criarBorboleta, 1500);

        function confirmar(vai) {
            const nome = document.getElementById('nome_convidado').value;
            if(!nome) { alert("Por favor, digite seu nome."); return; }
            const texto = vai ? `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;
            window.open(`https://wa.me/558189659847?text=${encodeURIComponent(texto)}`);
        }
    </script>
</body>
</html>
