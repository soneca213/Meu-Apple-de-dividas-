<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 Anos - Thaís Vitória</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            overflow: hidden; /* Mantém tudo na tela sem rolar */
            font-family: 'Montserrat', sans-serif;
        }

        /* Fundo com a sua imagem original */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/LzdS8mH/7163.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        /* Conteúdo Principal */
        .content {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.2); /* Efeito de vidro bem leve */
        }

        h2 { 
            font-family: 'Great Vibes', cursive; 
            font-size: 3.5rem; 
            color: #7b4397; 
            margin-bottom: -10px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 2.2rem; 
            color: #4a148c; 
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .detalhes {
            font-size: 1.1rem;
            color: #5e35b1;
            line-height: 1.8;
            margin-bottom: 30px;
            font-weight: 400;
        }

        /* Inputs e Botões */
        .interacao {
            width: 100%;
            max-width: 320px;
            z-index: 100;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 30px;
            border: 1px solid #d1c4e9;
            margin-bottom: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-mapa { background: #9c27b0; color: white; }
        .btn-sim { background: #4caf50; color: white; }
        .btn-nao { background: #e91e63; color: white; }
        .btn:active { transform: scale(0.95); }

        /* --- BORBOLETAS ANIMADAS --- */
        .butterfly {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 5;
        }

        .butterfly .wing {
            position: absolute;
            width: 15px;
            height: 20px;
            border-radius: 50% 50% 10% 40%;
            animation: flap 0.25s infinite alternate;
        }

        .butterfly .left {
            background: var(--c);
            left: 0;
            transform-origin: right;
        }

        .butterfly .right {
            background: var(--c);
            left: 15px;
            transform-origin: left;
            animation-delay: 0.1s;
            border-radius: 50% 50% 40% 10%;
        }

        @keyframes flap {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(75deg); }
        }

        @keyframes fly {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -50px) rotate(20deg); }
            50% { transform: translate(50px, -150px) rotate(-10deg); }
            75% { transform: translate(-100px, -50px) rotate(15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="bg-container"></div>

<div class="content">
    <h2>Meus 17 Anos</h2>
    <h1>THAÍS VITÓRIA</h1>

    <div class="detalhes">
        <p>✨ Você é meu convidado especial! ✨</p>
        <p>📅 <b>DATA:</b> 00/00/2026</p>
        <p>⏰ <b>HORA:</b> 19:00h</p>
        <p>📍 Rua Exemplo, 123 - Bairro</p>
    </div>

    <div class="interacao">
        <button onclick="window.open('https://maps.app.goo.gl/EXEMPLO')" class="btn btn-mapa">📍 VER NO MAPA</button>
        
        <input type="text" id="nome" placeholder="Digite seu nome para confirmar">
        
        <button onclick="confirmar(true)" class="btn btn-sim">✅ SIM, EU VOU!</button>
        <button onclick="confirmar(false)" class="btn btn-nao">❌ NÃO PODEREI IR</button>
    </div>
</div>

<script>
    // Criar Borboletas Coloridas
    const colors = ['#ce93d8', '#f8bbd0', '#b39ddb', '#9575cd', '#f48fb1'];
    for (let i = 0; i < 8; i++) {
        let b = document.createElement('div');
        b.className = 'butterfly';
        let color = colors[Math.floor(Math.random() * colors.length)];
        b.style.setProperty('--c', color);
        
        b.innerHTML = '<div class="wing left"></div><div class="wing right"></div>';
        
        b.style.top = Math.random() * 80 + "vh";
        b.style.left = Math.random() * 80 + "vw";
        b.style.animation = `fly ${Math.random() * 10 + 10}s linear infinite`;
        
        document.body.appendChild(b);
    }

    // Função WhatsApp
    function confirmar(vai) {
        const nome = document.getElementById('nome').value;
        const fone = "558189659847";
        if(!nome) { alert("Por favor, escreva seu nome!"); return; }

        let msg = vai ? 
            `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : 
            `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;

        window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`);
    }
</script>

</body>
</html>
