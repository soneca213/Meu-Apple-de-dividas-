<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Premium de Língua Portuguesa</title>
    <style>
        :root {
            --primary-color: #2b5c8f;
            --primary-hover: #1d3f63;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --text-muted: #718096;
            --correct-color: #2f855a;
            --correct-bg: #f0fff4;
            --correct-border: #c6f6d5;
            --incorrect-color: #9b2c2c;
            --incorrect-bg: #fff5f5;
            --incorrect-border: #fed7d7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .question-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            margin-bottom: 25px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: #1a202c;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .options-list li {
            margin-bottom: 12px;
        }

        .options-list label {
            display: flex;
            align-items: center;
            padding: 14px 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .options-list label:hover {
            background: #edf2f7;
            border-color: #cbd5e0;
        }

        .options-list input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            background-color: #fff;
            margin: 0 14px 0 0;
            font: inherit;
            color: var(--primary-color);
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #cbd5e0;
            border-radius: 50%;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .options-list input[type="radio"]::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--primary-color);
        }

        .options-list input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .options-list input[type="radio"]:checked {
            border-color: var(--primary-color);
        }

        .options-list label.selected-dark {
            border-color: var(--primary-color);
            background-color: #ebf8ff;
        }

        /* Classes de Correção */
        .options-list label.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-color) !important;
            font-weight: 600;
        }

        .options-list label.incorrect {
            background-color: var(--incorrect-bg) !important;
            border-color: var(--incorrect-border) !important;
            color: var(--incorrect-color) !important;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(43, 92, 143, 0.2);
            transition: background 0.2s, transform 0.1s;
            margin-top: 30px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        #result {
            margin-top: 40px;
            display: none;
        }

        .score-box {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border-left: 6px solid var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Simulado Preparatório</h1>
        <p class="subtitle">Língua Portuguesa — 15 Questões</p>
    </header>

    <form id="quizForm">
        <div id="questionsContainer"></div>
        <button type="button" class="btn-submit" onclick="gradeQuiz()">Finalizar e Enviar Respostas</button>
    </form>

    <div id="result">
        <div class="score-box" id="scoreBox"></div>
    </div>
</div>

<script>
    const quizData = [
        { id: 1, q: "Assinale a alternativa que apresenta um erro de regência verbal:", options: ["Assistimos ao filme ontem.", "Esqueci-me do compromisso.", "O cargo que ele aspira é alto.", "Prefiro café a chá."], correct: 2 },
        { id: 2, q: "Qual frase está correta quanto à concordância verbal?", options: ["Houveram muitos problemas.", "Faziam dois anos que não o via.", "Mais de um aluno se abraçaram.", "Fui eu que resolvi o exercício."], correct: 3 },
        { id: 3, q: "O uso da crase está INCORRETO em:", options: ["Refiro-me à diretora.", "Entreguei o documento à Vossa Excelência.", "Chegamos à uma hora da tarde.", "Estudou de segunda à sexta."], correct: 1 },
        { id: 4, q: "Em 'Sabe-se que haverá mudanças', a partícula 'se' é:", options: ["Pronome reflexivo", "Partícula apassivadora", "Índice de indeterminação do sujeito", "Conjunção integrante"], correct: 1 },
        { id: 5, q: "Identifique a palavra formada por derivação parassintética:", options: ["Infelizmente", "Deslealdade", "Anoitecer", "Girassol"], correct: 2 },
        { id: 6, q: "Assinale a alternativa onde a colocação pronominal está correta:", options: ["Me empreste o livro.", "Tudo resolveu-se rapidamente.", "Não me fale sobre isso.", "Tinham avisado-nos da prova."], correct: 2 },
        { id: 7, q: "Qual palavra está escrita corretamente conforme o Novo Acordo Ortográfico?", options: ["Idéia", "Vôo", "Autoestima", "Micro-ondas"], correct: 3 },
        { id: 8, q: "Na frase 'Embora chorasse, manteve a pose', a conjunção introduz valor de:", options: ["Causa", "Concessão", "Consequência", "Condição"], correct: 1 },
        { id: 9, q: "O termo destacado é complemento nominal em:", options: ["A leitura *dos livros* instrui.", "A casa *do Pedro* é bonita.", "Gosto *de chocolate*.", "Morava *perto da praia*."], correct: 0 },
        { id: 10, q: "Assinale o sinônimo correto para a palavra 'Efémero':", options: ["Duradouro", "Passageiro", "Eterno", "Forte"], correct: 1 },
        { id: 11, q: "Qual das opções apresenta uma frase de sentido ambíguo?", options: ["O menino viu o pássaro na árvore.", "O pai viu o filho correndo com seu cachorro.", "A menina comprou um livro novo.", "Eles viajaram ontem à noite."], correct: 1 },
        { id: 12, q: "A figura de linguagem presente em 'O sol amanheceu sorrindo' é:", options: ["Metáfora", "Prosopopeia", "Antítese", "Hipérbole"], correct: 1 },
        { id: 13, q: "Indique a alternativa que apresenta apenas substantivos abstratos:", options: ["Cadeira, mesa, amor", "Beleza, saudade, justiça", "Fada, ferro, pedra", "Deus, vento, luz"], correct: 1 },
        { id: 14, q: "A frase pontuada corretamente é:", options: ["Maria compre, pão, leite e café.", "Ontem à noite, nós fomos ao cinema.", "O menino, que era esperto resolveu tudo.", "Se você estudar, passará."], correct: 3 },
        { id: 15, q: "Indique o antônimo exato da palavra 'Altruísmo':", options: ["Generosidade", "Egoísmo", "Filantropia", "Humildade"], correct: 1 }
    ];

    const container = document.getElementById('questionsContainer');

    // Renderizar as questões
    quizData.forEach((item, index) => {
        let questionHtml = `
            <div class="question-card" id="block-${index}">
                <p class="question-text">${index + 1}. ${item.q}</p>
                <ul class="options-list">
        `;
        
        item.options.forEach((opt, optIndex) => {
            questionHtml += `
                <li>
                    <label id="label-${index}-${optIndex}" for="radio-${index}-${optIndex}">
                        <input type="radio" id="radio-${index}-${optIndex}" name="question-${index}" value="${optIndex}" onchange="saveProgress(${index}, ${optIndex})">
                        ${opt}
                    </label>
                </li>
            `;
        });

        questionHtml += `</ul></div>`;
        container.innerHTML += questionHtml;
    });

    // Salva a resposta e adiciona uma classe visual temporária de selecionado
    function saveProgress(qIndex, optIndex) {
        localStorage.setItem(`q-${qIndex}`, optIndex);
        
        // Remove destaque visual das outras opções da mesma pergunta
        quizData[qIndex].options.forEach((_, idx) => {
            document.getElementById(`label-${qIndex}-${idx}`).classList.remove('selected-dark');
        });
        // Adiciona à opção selecionada
        document.getElementById(`label-${qIndex}-${optIndex}`).classList.add('selected-dark');
    }

    // Carrega o progresso ao reabrir a página
    function loadProgress() {
        quizData.forEach((item, index) => {
            const savedValue = localStorage.getItem(`q-${index}`);
            if (savedValue !== null) {
                const input = document.getElementById(`radio-${index}-${savedValue}`);
                if (input) {
                    input.checked = true;
                    document.getElementById(`label-${index}-${savedValue}`).classList.add('selected-dark');
                }
            }
        });
    }

    // Corrige e exibe o resultado final
    function gradeQuiz() {
        let score = 0;
        
        quizData.forEach((item, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            
            // Limpa as classes de seleção e resposta
            item.options.forEach((_, optIndex) => {
                const lbl = document.getElementById(`label-${index}-${optIndex}`);
                lbl.className = '';
            });

            if (selected) {
                const answerIndex = parseInt(selected.value);
                
                if (answerIndex === item.correct) {
                    score++;
                    document.getElementById(`label-${index}-${answerIndex}`).className = 'correct';
                } else {
                    document.getElementById(`label-${index}-${answerIndex}`).className = 'incorrect';
                    document.getElementById(`label-${index}-${item.correct}`).className = 'correct';
                }
            } else {
                document.getElementById(`label-${index}-${item.correct}`).className = 'correct';
            }
        });

        const resultDiv = document.getElementById('result');
        const scoreBox = document.getElementById('scoreBox');
        resultDiv.style.display = 'block';
        
        const percentage = ((score / 15) * 100).toFixed(1);
        scoreBox.innerHTML = `🎯 Resultado do Simulado<br><span style="font-size: 1.1rem; font-weight: normal; color: var(--text-muted);">Você acertou <strong>${score}</strong> de <strong>15</strong> questões (${percentage}%)</span>`;
        
        resultDiv.scrollIntoView({ behavior: 'smooth' });
    }

    window.onload = loadProgress;
</script>

</body>
</html>
