<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Thaís Vitória</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;700&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-principal: #6d4c7d;
            --cor-acento: #b39ddb;
            --branco-transp: rgba(255, 255, 255, 0.85);
        }

        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f3e5f5;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* --- ESTILO DO ENVELOPE --- */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            z-index: 100;
            transition: 0.5s;
        }

        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background: #d1c4e9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .envelope:before {
            content: "";
            position: absolute;
            top: 0;
            z-index: 2;
            border-top: 110px solid #b39ddb;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            transform-origin: top;
            transition: all 0.5s ease-in-out;
        }

        .envelope:after {
            content: "";
            position: absolute;
            z-index: 1;
            width: 0;
            height: 0;
            border-top: 100px solid transparent;
            border-bottom: 100px solid #d1c4e9;
            border-left: 150px solid #9575cd;
            border-right: 150px solid #9575cd;
        }

        .heart {
            position: absolute;
            top: 90px;
            left: 135px;
            width: 30px;
            height: 30px;
            background: #e91e63;
            z-index: 3;
            transform: rotate(45deg);
            transition: 0.5s;
        }
        .heart:before, .heart:after {
            content: "";
            width: 30px;
            height: 30px;
            background: #e91e63;
            border-radius: 50%;
            position: absolute;
        }
        .heart:before { left: -15px; }
        .heart:after { top: -15px; }

        /* --- ANIMAÇÃO DE ABRIR --- */
        .aberto .envelope:before { transform: rotateX(180deg); z-index: 0; }
        .aberto .heart { opacity: 0; }
        .aberto { transform: translateY(200px); opacity: 0; pointer-events: none; }

        /* --- ESTILO DO CONVITE (DENTRO DA CARTA) --- */
        .convite-full {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                url('https://www.transparentpng.com/download/lavender/vXNfXU-lavender-cut-out.png'), /* Lavandas */
                url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueG5tZ3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3/l41lTfNf6O6O6O6O6/giphy.gif'); /* Borboletas */
            background-size: 100% auto, cover;
            background-position: bottom, center;
            background-repeat: no-repeat, no-repeat;
            background-color: #fdfbff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform: translateY(100%);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            padding: 20px;
        }

        .aberto + .convite-full { transform: translateY(0); }

        .card-branco {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 40px 20px;
            border-radius: 15px;
            border: 2px solid var(--cor-acento);
            max-width: 350px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        h2.idade { font-family: 'Great Vibes', cursive; color: var(--cor-principal); font-size: 2.5rem; margin: 0; }
        h1.nome { font-family: 'Pinyon Script', cursive; color: var(--cor-principal); font-size: 3.5rem; margin: 10px 0; }
        
        .frase { font-style: italic; color: #555; margin-bottom: 20px; font-size: 0.9rem; }
        
        .dados { font-size: 1rem; color: #333; line-height: 1.6; margin-bottom: 20px; }
        .dados b { color: var(--cor-principal); }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 30px;
            border: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-confirmar { background: #66bb6a; color: white; }
        .btn-recusar { background: transparent; color: #e91e63; border: 1px solid #e91e63; font-size: 0.7rem; }
        .btn-mapa { background: var(--cor-principal); color: white; margin-bottom: 15px; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 30px;
            border: 1px solid #ddd;
            text-align: center;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="envelope-wrapper" onclick="abrirCarta(this)">
        <div class="envelope">
            <div class="heart"></div>
        </div>
        <p style="text-align: center; color: #7b1fa2; font-weight: bold; margin-top: 20px;">Toque para abrir 💌</p>
    </div>

    <div class="convite-full">
        <div class="card-branco">
            <h2 class="idade">17 Anos</h2>
            <h1 class="nome">Thaís Vitória</h1>
            
            <p class="frase">"A vida é uma celebração e cada momento é um presente. Venha comemorar comigo!"</p>

            <div class="dados">
                📍 <b>LOCAL:</b> Rua Exemplo, 123, Bairro<br>
                📅 <b>DATA:</b> 25 de Abril de 2026<br>
                ⏰ <b>HORA:</b> 19:30h
            </div>

            <button onclick="window.open('https://www.google.com/maps')" class="btn btn-mapa">📍 VER LOCALIZAÇÃO</button>
            
            <input type="text" id="nome" placeholder="Digite seu nome completo">
            <button onclick="enviar(true)" class="btn btn-confirmar">Confirmar Presença</button>
            <button onclick="enviar(false)" class="btn btn-recusar">Infelizmente não poderei ir</button>
        </div>
    </div>

    <script>
        function abrirCarta(el) {
            el.classList.add('aberto');
        }

        function enviar(confirmou) {
            const nome = document.getElementById('nome').value;
            const fone = "558189659847";
            
            if(!nome) {
                alert("Por favor, digite seu nome!");
                return;
            }

            const msg = confirmou ? 
                `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : 
                `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;

            window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
