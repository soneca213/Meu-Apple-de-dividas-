<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convite Thaís Vitória</title>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            height: 100%;
            width: 100%;
            background: #f8f4f9;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; /* Impede barras de rolagem estranhas */
        }

        /* --- CENA DA CARTA (INICIAL) --- */
        #cena-envelope {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            background: #f8f4f9;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .envelope {
            position: relative;
            width: 280px;
            height: 180px;
            background: #e1bee7;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            border-top: 100px solid #b39ddb;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            transition: 0.5s;
            z-index: 2;
        }

        .selo-dourado {
            position: absolute;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #d4af37, #f9e29c);
            border-radius: 50%;
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 20px;
        }

        /* --- CONVITE EM TELA CHEIA --- */
        #convite-conteudo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            visibility: hidden;
            opacity: 0;
            transition: opacity 1.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
        }

        /* Fundo com Lavandas e Borboletas Reais */
        .background-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                url('https://i.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3pueG5tZ3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3R6Z3/l41lTfNf6O6O6O6O6/giphy.gif'), /* Borboletas */
                url('https://www.transparentpng.com/download/lavender/vXNfXU-lavender-cut-out.png'); /* Lavandas */
            background-position: center, bottom center;
            background-repeat: repeat, no-repeat;
            background-size: 300px, 100% auto;
            opacity: 0.6;
            z-index: 1;
        }

        .card-branco {
            position: relative;
            z-index: 5;
            width: 90%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 25px;
            border-radius: 20px;
            border: 1px solid rgba(181, 147, 219, 0.3);
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        .idade { font-family: 'Playfair Display', serif; color: #7b1fa2; letter-spacing: 4px; font-size: 1.1rem; margin-bottom: 10px; }
        .nome { font-family: 'Pinyon Script', cursive; color: #4a148c; font-size: 3.8rem; margin: 10px 0; }
        .frase { font-family: 'Playfair Display', serif; font-style: italic; color: #6d4c7d; font-size: 0.85rem; margin-bottom: 25px; }

        .info-box { margin-bottom: 25px; color: #333; font-size: 0.95rem; line-height: 1.8; }
        .info-box b { color: #7b1fa2; font-weight: 600; }

        /* Botões */
        .btn-link { color: #7b1fa2; text-decoration: underline; font-size: 0.8rem; cursor: pointer; display: block; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-bottom: 1px solid #d1c4e9;
            background: transparent;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            font-size: 1rem;
        }

        .btn-confirmar {
            width: 100%;
            padding: 15px;
            background: #7b1fa2;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .btn-nao { background: none; border: none; color: #999; margin-top: 10px; font-size: 0.75rem; cursor: pointer; text-decoration: underline; }

        /* Estado após clicar */
        .envelope-aberto { opacity: 0; visibility: hidden; }
        .mostrar-convite { visibility: visible !important; opacity: 1 !important; }

    </style>
</head>
<body>

    <div id="cena-envelope" onclick="abrirCarta()">
        <div class="envelope">
            <div class="selo-dourado">❤</div>
        </div>
        <p style="margin-top: 30px; color: #7b1fa2; letter-spacing: 2px; font-size: 0.9rem;">TOQUE PARA ABRIR</p>
    </div>

    <div id="convite-conteudo">
        <div class="background-decor"></div>
        
        <div class="card-branco">
            <p class="idade">17 ANOS</p>
            <h1 class="nome">Thaís Vitória</h1>
            
            <p class="frase">"A vida é um presente e cada momento deve ser celebrado com quem amamos."</p>

            <div class="info-box">
                📅 <b>25 DE ABRIL DE 2026</b><br>
                ⏰ <b>ÀS 19:30 HORAS</b><br>
                📍 <b>RUA NOME DA RUA, Nº 00</b>
            </div>

            <span class="btn-link" onclick="window.open('https://maps.google.com')">VER LOCALIZAÇÃO NO MAPA</span>

            <div class="form">
                <input type="text" id="nome_convidado" placeholder="Seu nome completo">
                <button class="btn-confirmar" onclick="mandarZap(true)">CONFIRMAR PRESENÇA</button>
                <button class="btn-nao" onclick="mandarZap(false)">Não poderei ir</button>
            </div>
        </div>
    </div>

    <script>
        function abrirCarta() {
            document.getElementById('cena-envelope').classList.add('envelope-aberto');
            setTimeout(() => {
                document.getElementById('convite-conteudo').classList.add('mostrar-convite');
            }, 500);
        }

        function mandarZap(confirmou) {
            const nome = document.getElementById('nome_convidado').value;
            const zap = "558189659847";
            
            if(!nome) {
                alert("Por favor, digite seu nome.");
                return;
            }

            const texto = confirmou ? 
                `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : 
                `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;

            window.open(`https://wa.me/${zap}?text=${encodeURIComponent(texto)}`);
        }
    </script>
</body>
</html>
