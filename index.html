<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17 Anos - Thaís Vitória</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #7a00ff;
            --secondary: #c400ff;
            --gold: #ffd700;
            --bg-dark: #0a0014;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at center, #1e0030, #0a0014);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Fundo de Estrelas */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .wrapper-total {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ENVELOPE 3D */
        .envelope-wrapper {
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope {
            position: relative;
            width: 320px;
            height: 200px;
            background: var(--primary);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .envelope:hover {
            transform: translateY(-10px) rotateX(5deg);
        }

        /* Aba Superior */
        .envelope::before {
            content: "";
            position: absolute;
            top: 0; z-index: 4;
            border-left: 160px solid transparent;
            border-right: 160px solid transparent;
            border-top: 110px solid #5a00bd;
            transform-origin: top;
            transition: transform 0.5s 0.3s;
        }

        .envelope.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }

        /* O CARTÃO INTERNO (O Pulo do Gato) */
        .card {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 300px;
            height: 180px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: transform 0.8s 0.6s, opacity 0.5s;
            z-index: 2;
            text-align: center;
        }

        .envelope.open .card {
            transform: translateY(-150px) scale(1.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-family: 'Pinyon Script', cursive;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 10px;
        }

        .card p { font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; }

        /* Texto de Instrução */
        .instruction {
            margin-top: 40px;
            font-weight: 300;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; text-shadow: 0 0 10px var(--secondary); }
        }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="stars"></canvas>

    <div class="wrapper-total" id="mainWrapper">
        <div class="envelope-wrapper" onclick="openEnvelope()">
            <div class="envelope" id="envelope">
                <div class="card">
                    <h2>Thaís Vitória</h2>
                    <p>My 17th Birthday</p>
                    <small style="margin-top: 10px; color: #ccc;">2026 • Save the Date</small>
                </div>
            </div>
        </div>
        <p class="instruction" id="instruction">CLIQUE PARA ABRIR</p>
    </div>

    <script>
        // 1. Efeito de Estrelas no Fundo
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const stars = Array.from({ length: 150 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            opacity: Math.random()
        }));

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.opacity})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.opacity += (Math.random() - 0.5) * 0.05;
                if(s.opacity < 0) s.opacity = 0;
                if(s.opacity > 1) s.opacity = 1;
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        // 2. Lógica de Abertura e Persistência
        function openEnvelope() {
            const env = document.getElementById('envelope');
            const inst = document.getElementById('instruction');
            
            if(!env.classList.contains('open')) {
                env.classList.add('open');
                inst.classList.add('hidden');
                
                // Salva no navegador que já abriu
                localStorage.setItem('thais_convite_aberto', 'true');

                // Explosão de Confetes Luxuosa
                const count = 200;
                const defaults = { origin: { y: 0.7 }, zIndex: 999 };

                function fire(particleRatio, opts) {
                    confetti({
                        ...defaults,
                        ...opts,
                        particleCount: Math.floor(count * particleRatio),
                        colors: ['#7a00ff', '#ffd700', '#ffffff']
                    });
                }

                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            }
        }

        // 3. Checar se já foi aberto ao recarregar (Persistência)
        window.onload = () => {
            if(localStorage.getItem('thais_convite_aberto') === 'true') {
                console.log("Bem-vinda de volta!");
                // Aqui você pode decidir se quer que ele já comece aberto
                // ou se apenas mostra uma mensagem diferente.
            }
        };
    </script>
</body>
</html>
