<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convite Especial</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Container com perspectiva */
.container {
    perspective: 1200px;
}

/* Carta */
.card {
    width: 340px;
    height: 230px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1.5s ease;
    cursor: pointer;
}

.card.open {
    transform: rotateY(180deg);
}

/* Frente e Verso */
.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 15px;
    backface-visibility: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

/* Frente */
.front {
    background: #ffffff;
    color: #333;
    font-size: 18px;
    position: relative;
}

/* Selo coração */
.selo {
    position: absolute;
    bottom: 20px;
    width: 70px;
    height: 70px;
    background: crimson;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    box-shadow: 0 0 15px rgba(255,0,0,0.7);
    animation: pulse 1.5s infinite;
}

/* Pulsar selo */
@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* Verso */
.back {
    background: #ffffff;
    transform: rotateY(180deg);
    padding: 20px;
    text-align: center;
}

/* Nome brilhando */
.nome {
    font-size: 30px;
    color: #ff4da6;
    text-shadow: 
        0 0 5px #ff4da6,
        0 0 10px #ff4da6,
        0 0 20px #ff66cc,
        0 0 40px #ff66cc;
    animation: brilho 2s infinite alternate;
}

@keyframes brilho {
    from { text-shadow: 0 0 5px #ff4da6; }
    to { text-shadow: 0 0 30px #ff66cc; }
}

/* Estrelas */
.star {
    position: fixed;
    top: -10px;
    color: gold;
    font-size: 18px;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="card" id="card">
        
        <div class="front">
            💌 Clique para abrir
            <div class="selo">❤️</div>
        </div>

        <div class="back">
            <h1>Convite Especial</h1>
            <h2 class="nome">Thais Vitória</h2>
            <p>Você é convidada para um momento inesquecível ✨</p>
        </div>

    </div>
</div>

<script>
const card = document.getElementById("card");
let aberto = false;
let estrelasAtivas = false;

card.addEventListener("click", () => {

    if (aberto) return;
    aberto = true;

    // Pequena demora antes de virar
    setTimeout(() => {
        card.classList.add("open");

        if (!estrelasAtivas) {
            estrelasAtivas = true;
            iniciarEstrelas();
        }

    }, 800);
});

function iniciarEstrelas() {
    setInterval(() => {

        const star = document.createElement("div");
        star.classList.add("star");
        star.innerHTML = "⭐";

        star.style.left = Math.random() * window.innerWidth + "px";
        star.style.animationDuration = (Math.random() * 3 + 2) + "s";

        document.body.appendChild(star);

        setTimeout(() => {
            star.remove();
        }, 5000);

    }, 250);
}
</script>

</body>
</html>
