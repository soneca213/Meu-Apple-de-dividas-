<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thaís Vitória - 17 Anos</title>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Pinyon+Script&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6d4c7d;
            --accent: #b39ddb;
            --text: #4a148c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #fdfbff;
        }

        /* Fundo com a sua imagem original */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/LzdS8mH/7163.jpg');
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: brightness(1.05);
        }

        /* Overlay suave para dar leitura */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 100%);
        }

        /* Conteúdo central */
        .main-container {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around; /* Distribui melhor os elementos na vertical */
            align-items: center;
            padding: 40px 20px;
            z-index: 10;
            animation: fadeIn 2.5s ease-in-out;
        }

        .header h2 {
            font-family: 'Alex Brush', cursive;
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: -15px;
        }

        .header h1 {
            font-family: 'Pinyon Script', cursive;
            font-size: 3.8rem;
            color: var(--text);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .details {
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            letter-spacing: 2px;
            line-height: 2;
        }

        .details b { color: var(--primary); font-weight: 400; font-size: 1.1rem; }

        /* Estilo dos Botões e Input */
        .actions {
            width: 100%;
            max-width: 300px;
        }

        .input-name {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            outline: none;
            transition: 0.3s;
        }

        .input-name:focus { border-color: var(--primary); background: white; }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 2px; /* Botão mais quadrado fica mais elegante */
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            border: 1px solid var(--accent);
        }

        .btn-map { background: transparent; color: var(--text); border: 1px solid var(--text); }
        .btn-yes { background: var(--primary); color: white; border: none; }
        .btn-no { background: transparent; color: #888; border: none; font-size: 0.7rem; }

        .btn:hover { letter-spacing: 4px; opacity: 0.8; }

        /* BORBOLETAS */
        .butterfly {
            position: absolute;
            width: 25px;
            height: 20px;
            z-index: 5;
            pointer-events: none;
        }

        .wing {
            position: absolute;
            width: 12px;
            height: 18px;
            background: var(--color);
            border-radius: 50% 50% 20% 50%;
            opacity: 0.6;
            animation: flap 0.3s infinite alternate ease-in-out;
        }

        .wing.right {
            left: 12px;
            transform-origin: left;
            border-radius: 50% 50% 50% 20%;
        }

        .wing.left {
            transform-origin: right;
            animation-delay: 0.1s;
        }

        @keyframes flap {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(70deg); }
        }

        @keyframes fly {
            0% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(150px, -200px) rotate(30deg); }
            66% { transform: translate(-100px, -400px) rotate(-20deg); }
            100% { transform: translate(0, -600px) rotate(10deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="main-container">
    <div class="header">
        <h2>Meus 17 Anos</h2>
        <h1>Thaís Vitória</h1>
    </div>

    <div class="details">
        <p>CONVIDO VOCÊ PARA CELEBRAR</p>
        <p>📅 <b>00 . 00 . 2026</b></p>
        <p>⏰ <b>ÀS 19:30 HORAS</b></p>
        <p>📍 RUA NOME DA RUA, Nº 00</p>
    </div>

    <div class="actions">
        <button onclick="window.open('https://maps.google.com')" class="btn btn-map">Ver Localização</button>
        
        <input type="text" id="guestName" class="input-name" placeholder="Seu nome completo">
        
        <button onclick="sendWhatsApp(true)" class="btn btn-yes">Confirmar Presença</button>
        <button onclick="sendWhatsApp(false)" class="btn btn-no">Infelizmente não poderei ir</button>
    </div>
</div>

<script>
    // Criar borboletas voando de baixo para cima
    const colors = ['#d1c4e9', '#f8bbd0', '#e1bee7', '#b39ddb'];
    
    function createButterfly() {
        const b = document.createElement('div');
        b.className = 'butterfly';
        const color = colors[Math.floor(Math.random() * colors.length)];
        b.style.setProperty('--color', color);
        
        b.innerHTML = '<div class="wing left"></div><div class="wing right"></div>';
        
        // Posição inicial na parte de baixo
        b.style.left = Math.random() * 100 + "vw";
        b.style.top = "110vh";
        
        // Velocidade e tamanho aleatórios
        const duration = Math.random() * 8 + 7;
        b.style.animation = `fly ${duration}s linear infinite`;
        b.style.transform = `scale(${Math.random() * 0.5 + 0.5})`;
        
        document.body.appendChild(b);
        
        // Remove depois que subir para não pesar o site
        setTimeout(() => b.remove(), duration * 1000);
    }

    // Criar uma nova borboleta a cada 2 segundos
    setInterval(createButterfly, 2000);
    for(let i=0; i<5; i++) createButterfly(); // Começa com algumas na tela

    function sendWhatsApp(isComing) {
        const name = document.getElementById('guestName').value;
        const phone = "558189659847";
        
        if(!name) {
            alert("Por favor, digite seu nome para a confirmação.");
            return;
        }

        const text = isComing ? 
            `Olá Thaís Vitória, sou ${name} e estou confirmando para a sua festa!` : 
            `Poxa Thaís, sou ${name} e não poderei ir para sua festa.`;

        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`);
    }
</script>

</body>
</html>
