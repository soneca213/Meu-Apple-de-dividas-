<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Interativo - Thaís Vitória</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: #f3e5f5; /* Cor de fundo suave caso a imagem demore a carregar */
            background-image: url('https://i.ibb.co/LzdS8mH/7163.jpg'); /* Sua imagem de fundo */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Estilo do Card do Convite */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 350px;
            text-align: center;
            border: 2px solid #d1c4e9;
            position: relative;
            z-index: 10;
        }

        h1 { color: #7b1fa2; font-size: 28px; margin-bottom: 5px; }
        p { color: #4a148c; margin: 10px 0; }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ce93d8;
            outline: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-mapa { background: #9575cd; color: white; }
        .btn-sim { background: #66bb6a; color: white; }
        .btn-nao { background: #ef5350; color: white; }
        .btn:hover { transform: scale(1.05); }

        /* --- ANIMAÇÃO DAS BORBOLETAS --- */
        .butterfly {
            position: fixed;
            width: 20px;
            height: 20px;
            z-index: 1;
            pointer-events: none;
        }

        /* As asas */
        .butterfly::before, .butterfly::after {
            content: '';
            position: absolute;
            top: 0;
            width: 10px;
            height: 15px;
            border-radius: 50% 50% 20% 20%;
            animation: flap 0.2s infinite alternate;
        }

        .butterfly::before {
            left: 0;
            transform-origin: right;
        }

        .butterfly::after {
            left: 10px;
            transform-origin: left;
            animation-delay: 0.1s;
        }

        @keyframes flap {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(80deg); }
        }

        @keyframes move {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(100px, -100px) rotate(20deg); }
            50% { transform: translate(200px, 50px) rotate(-20deg); }
            75% { transform: translate(-100px, 150px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <p>VOCÊ ESTÁ CONVIDADO!</p>
    <h1>Thaís Vitória</h1>
    <p>✨ <b>Meus 17 Anos</b> ✨</p>
    
    <p>📅 <b>Data:</b> [Insira a Data]<br>
       ⏰ <b>Hora:</b> [Insira a Hora]</p>

    <p>📍 [Nome da Rua e Número]</p>
    
    <a href="https://www.google.com/maps" target="_blank" class="btn btn-mapa">📍 VER LOCALIZAÇÃO</a>

    <hr style="border: 0.5px solid #e1bee7; margin: 20px 0;">

    <p><b>Confirme sua presença:</b></p>
    <input type="text" id="nomeConvidado" placeholder="Digite seu nome...">
    
    <button onclick="confirmar(true)" class="btn btn-sim">✅ SIM, EU VOU!</button>
    <button onclick="confirmar(false)" class="btn btn-nao">❌ NÃO PODEREI IR</button>
</div>

<script>
    // Gerador de Borboletas Coloridas
    const colors = ['#e1bee7', '#ce93d8', '#ba68c8', '#f8bbd0', '#b39ddb'];
    
    for (let i = 0; i < 12; i++) {
        let b = document.createElement('div');
        b.className = 'butterfly';
        let color = colors[Math.floor(Math.random() * colors.length)];
        
        // Estilo das asas com cores aleatórias
        b.style.setProperty('--c', color);
        b.innerHTML = `<style>.b${i}::before, .b${i}::after { background: ${color}; opacity: 0.7; }</style>`;
        b.classList.add(`b${i}`);

        // Posição inicial aleatória
        b.style.top = Math.random() * 100 + "vh";
        b.style.left = Math.random() * 100 + "vw";
        
        // Movimento aleatório
        b.style.animation = `move ${Math.random() * 10 + 5}s linear infinite`;
        
        document.body.appendChild(b);
    }

    // Função do WhatsApp
    function confirmar(vai) {
        var nome = document.getElementById('nomeConvidado').value;
        var telefone = "558189659847";
        if (nome === "") { alert("Por favor, digite seu nome!"); return; }

        var msg = vai ? 
            `Olá Thaís Vitória, sou ${nome} e estou confirmando para a sua festa!` : 
            `Poxa Thaís, sou ${nome} e não poderei ir para sua festa.`;

        window.open(`https://wa.me/${telefone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>

</body>
</html>
