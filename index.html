<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 Anos - Thaís Vitória</title>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
min-height:100vh;
background:radial-gradient(circle at center,#2a003f,#12001c);
font-family:'Montserrat',sans-serif;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

/* ===== CENA INICIAL ===== */
#cena-abertura{
position:fixed;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
z-index:100;
background:#12001c;
transition:1s ease-in-out;
}

.texto-abrir{
color:#fff;
font-size:1rem;
opacity:0.8;
animation:pulsar 2s infinite;
}

@keyframes pulsar{
0%,100%{opacity:0.5;}
50%{opacity:1;}
}

.envelope-wrapper{
position:relative;
cursor:pointer;
perspective:1000px;
}

.envelope{
position:relative;
width:320px;
height:210px;
background:#7b1fa2;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
border-radius:0 0 12px 12px;
overflow:hidden;
}

.tampa{
position:absolute;
top:0;
width:0;
height:0;
border-top:115px solid #9c27b0;
border-left:160px solid transparent;
border-right:160px solid transparent;
transform-origin:top;
transition:transform 1s ease;
z-index:3;
}

.envelope-wrapper.aberta .tampa{
transform:rotateX(180deg);
}

/* Papel subindo */
.papel{
position:absolute;
bottom:0;
left:10%;
width:80%;
height:140px;
background:white;
border-radius:8px;
transition:0.8s ease;
z-index:1;
}

.envelope-wrapper.aberta .papel{
transform:translateY(-120px);
}

/* ===== CARTÃO ===== */
.card-luxo{
display:none;
opacity:0;
transform:scale(0.9);
transition:1s ease;
position:relative;
z-index:2;
width:92%;
max-width:500px;
max-height:90vh;
background:rgba(255,255,255,0.95);
border-radius:35px;
padding:35px 25px;
flex-direction:column;
gap:20px;
text-align:center;
overflow-y:auto;
border:3px solid #7a00ff;
box-shadow:0 0 25px #7a00ff;
}

.card-luxo.mostrar{
display:flex;
opacity:1;
transform:scale(1);
}

.idade{
font-family:'Playfair Display',serif;
font-size:1.8rem;
letter-spacing:8px;
color:#7b1fa2;
}

.nome{
font-family:'Pinyon Script',cursive;
font-size:4rem;
color:#7b1fa2;
}

.frase{
font-style:italic;
color:#6d4c7d;
}

input{
padding:15px;
border:none;
border-bottom:3px solid #aa00ff;
background:transparent;
text-align:center;
font-size:1rem;
outline:none;
}

button{
padding:18px;
background:#7b1fa2;
color:white;
border:none;
border-radius:15px;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{background:#9c00ff;}

.nao-ir{
margin-top:10px;
color:#7a00ff;
cursor:pointer;
font-weight:600;
}
</style>
</head>

<body>

<!-- Áudio -->
<audio id="musica" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<!-- Cena da carta -->
<div id="cena-abertura">
<div class="envelope-wrapper" onclick="abrirCarta()">
<div class="envelope">
<div class="tampa"></div>
<div class="papel"></div>
</div>
</div>
<p class="texto-abrir">Toque na carta para abrir 💌</p>
</div>

<!-- Convite -->
<div class="card-luxo">
<p class="idade">17 ANOS</p>
<h1 class="nome">Thaís Vitória</h1>

<p class="frase">
"Celebrar a vida é colecionar momentos ao lado de quem amamos."
</p>

<div>
📅 <b>25 DE ABRIL DE 2026</b><br>
⏰ <b>ÀS 19:30 HORAS</b><br>
📍 <b>RUA DO EVENTO, Nº 00</b>
</div>

<input type="text" id="nomeConvidado" placeholder="Seu nome completo">

<button onclick="confirmar(true)">CONFIRMAR PRESENÇA</button>
<p class="nao-ir" onclick="confirmar(false)">Não poderei ir</p>

</div>

<script>
function abrirCarta(){
if(navigator.vibrate){navigator.vibrate(100);}

const envelope = document.querySelector(".envelope-wrapper");
const cena = document.getElementById("cena-abertura");
const card = document.querySelector(".card-luxo");
const musica = document.getElementById("musica");

envelope.classList.add("aberta");
musica.play();

setTimeout(()=>{
cena.style.opacity="0";
setTimeout(()=>{
cena.style.display="none";
card.classList.add("mostrar");
},1000);
},1200);
}

function confirmar(vai){
const nome = document.getElementById("nomeConvidado").value;

if(!nome){
alert("Digite seu nome antes de confirmar.");
return;
}

const numero = "558184378356";

let mensagem;

if(vai){
mensagem = `Confirmado ✅ ${nome} estará presente na festa da Thaís Vitória!`;
}else{
mensagem = `${nome} infelizmente não poderá comparecer à festa.`;
}

window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`, "_blank");
}
</script>

</body>
</html>
