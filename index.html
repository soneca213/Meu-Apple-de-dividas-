<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador Financeiro Pro - Salvo</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1a1a1a;
            --primary: #ff8c00;
            --primary-hover: #e07b00;
            --text-color: #ffffff;
            --text-secondary: #aaaaaa;
            --danger: #ff4444;
            --input-bg: #222222;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.1);
            border: 1px solid #333;
        }

        h2 { text-align: center; color: var(--primary); letter-spacing: 1px; }

        .input-group { margin-bottom: 15px; }

        label { display: block; margin-bottom: 8px; color: var(--text-secondary); font-size: 13px; text-transform: uppercase; }

        input {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid #333;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 8px rgba(255, 140, 0, 0.3); }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: black;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover { background: var(--primary-hover); transform: scale(1.02); }

        .summary {
            margin-top: 30px;
            padding: 20px;
            background: #111;
            border-radius: 15px;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .balance-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; }
        .balance-value { font-size: 32px; font-weight: bold; color: var(--primary); }

        table { width: 100%; margin-top: 25px; border-collapse: collapse; }
        th { text-align: left; color: var(--primary); border-bottom: 2px solid #333; padding: 12px; font-size: 14px; }
        td { padding: 12px; border-bottom: 1px solid #222; font-size: 14px; }
        
        .btn-delete { color: var(--danger); cursor: pointer; text-align: center; font-size: 18px; }
        .btn-delete:hover { opacity: 0.7; }
    </style>
</head>
<body>

<div class="container">
    <h2>MINHAS CONTAS</h2>
    
    <div class="input-group">
        <label>Saldo Total Disponível</label>
        <input type="number" id="totalIncome" placeholder="Ex: 3000" oninput="saveData()">
    </div>

    <div style="margin: 30px 0; border-bottom: 1px solid #333;"></div>

    <div class="input-group">
        <label>Motivo do Gasto</label>
        <input type="text" id="reason" placeholder="Ex: Internet">
    </div>
    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex: 2;">
            <label>Valor (R$)</label>
            <input type="number" id="cost" placeholder="0.00">
        </div>
        <div style="flex: 2;">
            <label>Data</label>
            <input type="date" id="payDate">
        </div>
    </div>
    <button onclick="addExpense()">Adicionar Gasto</button>

    <div class="summary">
        <div class="balance-label">SOBRA LÍQUIDA:</div>
        <div class="balance-value" id="finalBalance">R$ 0,00</div>
    </div>

    <table id="expenseTable">
        <thead>
            <tr>
                <th>Motivo</th>
                <th>Data</th>
                <th>Valor</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="expenseList"></tbody>
    </table>
</div>

<script>
    let expenses = JSON.parse(localStorage.getItem('myExpenses')) || [];
    document.getElementById('totalIncome').value = localStorage.getItem('myIncome') || '';

    function saveData() {
        const income = document.getElementById('totalIncome').value;
        localStorage.setItem('myIncome', income);
        localStorage.setItem('myExpenses', JSON.stringify(expenses));
        calculate();
    }

    function addExpense() {
        const reason = document.getElementById('reason').value;
        const cost = parseFloat(document.getElementById('cost').value);
        const payDate = document.getElementById('payDate').value;

        if (!reason || isNaN(cost)) return alert("Preencha os dados!");

        expenses.push({ id: Date.now(), reason, cost, payDate: payDate || '--' });
        
        document.getElementById('reason').value = '';
        document.getElementById('cost').value = '';
        document.getElementById('payDate').value = '';
        
        saveData();
        updateUI();
    }

    function removeExpense(id) {
        expenses = expenses.filter(e => e.id !== id);
        saveData();
        updateUI();
    }

    function calculate() {
        const income = parseFloat(document.getElementById('totalIncome').value) || 0;
        const totalExpenses = expenses.reduce((sum, e) => sum + e.cost, 0);
        const result = income - totalExpenses;

        const balanceDisplay = document.getElementById('finalBalance');
        balanceDisplay.innerText = result.toLocaleString('pt-br', {style: 'currency', currency: 'BRL'});
        balanceDisplay.style.color = result < 0 ? "#ff4444" : "#ff8c00";
    }

    function updateUI() {
        const list = document.getElementById('expenseList');
        list.innerHTML = '';
        expenses.forEach(e => {
            list.innerHTML += `<tr>
                <td>${e.reason}</td>
                <td style="color: #888">${e.payDate}</td>
                <td>R$ ${e.cost.toFixed(2)}</td>
                <td class="btn-delete" onclick="removeExpense(${e.id})">×</td>
            </tr>`;
        });
        calculate();
    }

    // Carregar dados ao abrir
    updateUI();
</script>

</body>
</html>
