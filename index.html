<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 Anos - Thaís Vitória</title>

<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Montserrat:wght@300;400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
min-height:100vh;
background:radial-gradient(circle at center,#2a003f,#12001c);
font-family:'Montserrat',sans-serif;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:#333;
}

/* ===== ESTRELAS SUAVES ===== */
#estrelas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
}

.estrela{
position:absolute;
width:3px;
height:3px;
background:#fff;
border-radius:50%;
opacity:0.6;
animation:piscar 3s infinite ease-in-out;
}

@keyframes piscar{
0%,100%{opacity:0.2;}
50%{opacity:1;}
}

/* ===== CENA INICIAL ===== */
#cena-abertura{
position:fixed;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
gap:20px;
z-index:100;
background:#12001c;
transition:1s ease-in-out;
}

.texto-abrir{
color:#fff;
opacity:0.7;
animation:pulsar 2s infinite;
}

@keyframes pulsar{
0%,100%{opacity:0.4;}
50%{opacity:1;}
}

.envelope-wrapper{
position:relative;
cursor:pointer;
perspective:1000px;
}

.envelope{
position:relative;
width:320px;
height:210px;
background:#7b1fa2;
border-radius:0 0 12px 12px;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
overflow:hidden;
}

.tampa{
position:absolute;
top:0;
width:0;
height:0;
border-top:115px solid #9c27b0;
border-left:160px solid transparent;
border-right:160px solid transparent;
transform-origin:top;
transition:transform 1s ease;
z-index:3;
}

.envelope-wrapper.aberta .tampa{
transform:rotateX(180deg);
}

.papel{
position:absolute;
bottom:0;
left:10%;
width:80%;
height:140px;
background:white;
border-radius:8px;
transition:1s ease;
z-index:1;
}

.envelope-wrapper.aberta .papel{
transform:translateY(-130px);
}

/* ===== CARTÃO ===== */
.card{
display:none;
opacity:0;
transform:scale(0.9);
transition:1s ease;
position:relative;
z-index:2;
width:92%;
max-width:500px;
background:rgba(255,255,255,0.95);
border-radius:30px;
padding:30px;
text-align:center;
box-shadow:0 0 30px #7a00ff;
}

.card.mostrar{
display:block;
opacity:1;
transform:scale(1);
}

.nome-digitado{
font-size:0.9rem;
margin-bottom:10px;
color:#7b1fa2;
}

.idade{
font-family:'Playfair Display',serif;
letter-spacing:6px;
color:#7b1fa2;
}

.nome{
font-family:'Pinyon Script',cursive;
font-size:4rem;
color:#7b1fa2;
}

.frase{
font-style:italic;
margin:15px 0;
}

.contagem{
margin:15px 0;
font-weight:bold;
color:#6a00ff;
}

input{
width:100%;
padding:12px;
border:none;
border-bottom:2px solid #aa00ff;
text-align:center;
outline:none;
margin-top:15px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#7b1fa2;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

.nao-ir{
margin-top:10px;
color:#7a00ff;
cursor:pointer;
font-size:0.9rem;
}
</style>
</head>

<body>

<div id="estrelas"></div>

<audio id="musica" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div id="cena-abertura">
<div class="envelope-wrapper" onclick="abrirCarta()">
<div class="envelope">
<div class="tampa"></div>
<div class="papel"></div>
</div>
</div>
<p class="texto-abrir">Toque na carta para abrir 💌</p>
</div>

<div class="card">
<div class="nome-digitado" id="saudacao"></div>

<p class="idade">17 ANOS</p>
<h1 class="nome">Thaís Vitória</h1>

<p class="frase">
"Celebrar a vida é colecionar momentos ao lado de quem amamos."
</p>

<div class="contagem" id="contador"></div>

<div>
📅 <b>25 DE ABRIL DE 2026</b><br>
⏰ <b>ÀS 19:30 HORAS</b><br>
📍 <b>RUA DO EVENTO, Nº 00</b>
</div>

<input type="text" id="nomeConvidado" placeholder="Seu nome completo">

<button onclick="confirmar(true)">CONFIRMAR PRESENÇA</button>
<p class="nao-ir" onclick="confirmar(false)">Não poderei ir</p>
</div>

<script>
/* estrelas */
for(let i=0;i<120;i++){
const e=document.createElement("div");
e.className="estrela";
e.style.left=Math.random()*100+"vw";
e.style.top=Math.random()*100+"vh";
e.style.animationDuration=(Math.random()*3+2)+"s";
document.getElementById("estrelas").appendChild(e);
}

/* abrir carta */
function abrirCarta(){
if(navigator.vibrate){navigator.vibrate(100);}
document.querySelector(".envelope-wrapper").classList.add("aberta");
document.getElementById("musica").play();

setTimeout(()=>{
document.getElementById("cena-abertura").style.display="none";
document.querySelector(".card").classList.add("mostrar");
},1500);
}

/* contador */
const dataEvento=new Date("April 25, 2026 19:30:00").getTime();
setInterval(()=>{
const agora=new Date().getTime();
const distancia=dataEvento-agora;
if(distancia>0){
const dias=Math.floor(distancia/(1000*60*60*24));
const horas=Math.floor((distancia%(1000*60*60*24))/(1000*60*60));
const minutos=Math.floor((distancia%(1000*60*60))/(1000*60));
document.getElementById("contador").innerHTML=
`Faltam ${dias} dias, ${horas}h e ${minutos}min 🎉`;
}
},1000);

/* confirmar */
function confirmar(vai){
const nome=document.getElementById("nomeConvidado").value;
if(!nome){alert("Digite seu nome.");return;}

document.getElementById("saudacao").innerHTML=`Convite aberto por ${nome} ✨`;

const numero="558184378356";
let mensagem=vai?
`Confirmado ✅ ${nome} estará presente na festa!`:
`${nome} infelizmente não poderá comparecer.`;

window.open(`https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`,"_blank");
}
</script>

</body>
</html>
